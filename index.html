<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Truyện Nhà Nàng</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="overlay"></div>

<header>
    <div class="logo">🌙 Truyện Nhà Nàng</div>

    <nav>
        <a href="#">Trang Chủ</a>
        <a href="#">Danh Sách Truyện</a>
        <a href="#">Mới Cập Nhật</a>
    </nav>
</header>

<section class="hero">
    <h1>Đọc truyện trong màn đêm ✨</h1>
    <p>Anime aesthetic • Dark mode • Chill vibes</p>
</section>

<section class="card-list">

<div class="story-card">
    <img src="https://images.unsplash.com/photo-1516979187457-637abb4f9353?q=80&w=1200&auto=format&fit=crop" alt="">

    <div class="story-info">
        <h2>Truyện Nhà Nàng</h2>
        <p>Thế giới truyện đêm đầy cảm xúc...</p>

        <button onclick="loadChap(0)">
            Đọc Ngay
        </button>
    </div>
</div>

</section>

<section class="reader">

<h1 id="chap-title">Chương 1</h1>

<div id="chap-content">
Đang tải nội dung...
</div>

<div class="buttons">
    <button onclick="prevChap()">⬅ Chap trước</button>
    <button onclick="nextChap()">Chap tiếp ➡</button>
</div>

</section>

<button class="music-btn" onclick="toggleMusic()">♫</button>

<audio id="music" loop>
</audio>

<script src="js/app.js"></script>

</body>
</html>
